# GitHub Actions workflow for Python application
# Installs dependencies, lints, type-checks and tests. Every step is strict:
# a green build means lint, types and tests all actually pass.
# The scan job is the dependency CVE gate (make scan); the weekly cron
# re-scans unchanged code because CVEs are published against libraries
# already shipped.

name: Python application

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e ".[dev]"

    - name: Check formatting with black
      run: |
        black --check src/ tests/ config/ scripts/

    - name: Lint with flake8
      run: |
        flake8 src/ tests/ config/ scripts/ --max-line-length=88 --extend-ignore=E203 --max-complexity=10 --statistics

    - name: Type check with mypy
      run: |
        mypy src/ config/ scripts/

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov --cov-report=term-missing --cov-fail-under=85

  scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e ".[dev]"

    - name: Install Trivy
      uses: aquasecurity/setup-trivy@v0.3.1
      with:
        cache: true

    - name: Dependency CVE gate
      run: |
        make scan
