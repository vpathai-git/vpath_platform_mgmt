apiVersion: vpath/v1
kind: VpathApp
metadata:
  name: vpath-agentic-resource-modeling
  namespace: vpath-agentic-resource-modeling
  labels:
    app.kubernetes.io/part-of: vpath
spec:
  deploy:
    readinessBudget: 300
  type: web
  image: vpath-agentic-resource-modeling
  basePath: /agentic-resource-modeling
  port: 3021
  auth:
    oidcClient: vpath-agentic-resource-modeling
  resources:
    requests: { memory: "256Mi", cpu: "100m" }
    limits: { memory: "512Mi", cpu: "500m" }
  health:
    readiness: /agentic-resource-modeling/api/healthz
    liveness: /agentic-resource-modeling/api/healthz
    scheme: HTTPS
  dapr:
    appId: vpath-agentic-resource-modeling
    appPort: 3021
  volumes:
    - { name: mkcert-ca, mountPath: /etc/ssl/certs/rootCA.pem, type: secret, sourceName: mkcert-ca }
    - { name: tls-certs, mountPath: /certs, type: secret, sourceName: mkcert-tls }
  ui:
    title: Agentic Resource Modeling
    description: Compose & validate an agent-provider configuration in the cognition shape
    icon: brain-circuit
    sidebar: true
  # The NEED face, filled FOR REAL: this app DECLARES an agent-provider resource
  # so the platform provisions/injects it (contrast vpath-fortune-teller, which
  # binds nothing and leaves the NEED face honestly empty). The user PICKS the
  # authorized instance in the shell (selection: user-selectable); 'configure'
  # lets the modeler edit platform-level settings for it. The shared LLM key is
  # platform-managed (envfrom) — the app NEVER reads it (CLAUDE.md §1; plan §9).
  resourceRequirements:
    required:
      - class: agent-provider
        actions: [use, configure]
    selection:
      agent-provider: user-selectable
  env:
    # Dapr service invocation via the sidecar; createProxyRoute appends the
    # request path. Target is the Python api app (appId.namespace). Read per
    # request, never baked into the build (CLAUDE.md §5).
    - name: VPATH_MODELING_API_URL
      value: "http://localhost:3500/v1.0/invoke/vpath-agentic-resource-modeling-api.vpath-agentic-resource-modeling/method"
  build:
    runtime: node
    hash:
      dirs:
        - apps_infra/apps/vpath-agentic-resource-modeling
        - apps_infra/sdk
    sdks:
      - name: "@vpath/sdk"
        source: apps_infra/sdk
