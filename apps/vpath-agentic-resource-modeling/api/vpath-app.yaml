apiVersion: vpath/v1
kind: VpathApp
metadata:
  name: vpath-agentic-resource-modeling-api
  namespace: vpath-agentic-resource-modeling
  labels:
    app.kubernetes.io/part-of: vpath
spec:
  deploy:
    readinessBudget: 300
  type: backend
  image: vpath-agentic-resource-modeling-api
  port: 8021
  auth:
    oidcClient: vpath-agentic-resource-modeling
  resources:
    requests: { memory: "128Mi", cpu: "50m" }
    limits: { memory: "256Mi", cpu: "250m" }
  health:
    readiness: /health
    liveness: /health
    scheme: HTTP
  dapr:
    appId: vpath-agentic-resource-modeling-api
    appPort: 8021
  # The CONSUMING pod: it reads the currently-bound agent-provider (read-only)
  # via the SDK ResourceManifest to show "what's live". The non-secret config
  # (provider/model/variant) is delivered to /etc/vpath/resource.json
  # (delivery: resource_json). The shared LLM key is platform-managed (envfrom)
  # and is NEVER read by this app — it models config, not credentials.
  resourceRequirements:
    required:
      - class: agent-provider
        actions: [use]
        delivery: resource_json
  build:
    runtime: python
    hash:
      dirs:
        - apps_infra/apps/vpath-agentic-resource-modeling-api
        - apps_infra/sdk-python/vpath-backend-sdk
    sdks:
      - name: vpath-backend-sdk
        source: apps_infra/sdk-python/vpath-backend-sdk
