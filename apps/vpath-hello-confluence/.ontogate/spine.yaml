# vpath-hello-confluence — Spine-3 catalog: the app filling the app-hull
# foundation, adopted RETROACTIVELY (this is the kit's FIRST example, built
# before the methodology stood; the 34-contract audit ran green on the
# UNMODIFIED app, so this adoption adds the gate — it fixes nothing).
#
# SOURCE OF TRUTH (LinkML-shaped data). ontology.json is GENERATED from this file
# by regenerate.py (stamps generated_from / source_sha256 / generated_with) —
# never edit ontology.json by hand; a stale copy fails gatelib M10 (exit 2).
#
# The gate (check.py) composes THREE layers:
#   (1) the kit's vendored gatelib  — freshness / story_lint / verdict,
#   (2) the foundation audit (kit foundation/audit) run against THIS app repo,
#   (3) app-specific stories over this catalog (positive per contract + negative
#       red-drill mutations) PLUS an app-strict NEED check that is PAIR-WIDE:
#       this example is a TWO-MANIFEST pair (web vpath-app.yaml + the sibling
#       api/vpath-app.yaml) and BOTH must carry the declared
#       resourceRequirements — the api reads the gate-injected credential
#       headers, so its own manifest must authorize that use.
#
# as_is PINS (findings to drain, per foundation/ADOPTION.md step 4 — both are
# PLATFORM findings, neither is an app defect; details in README.md):
#   F1 sibling-invoke URL — env.VPATH_HELLO_CONFLUENCE_API_URL hand-authors a
#      Dapr-shape invoke URL to the api sibling because NO manifest field
#      expresses a sibling invoke (the jira-demo nuance the hull records under
#      C-no-handbuilt-dapr-url: the platform owes a sibling-invoke declaration).
#   F2 platform-pr/ in-tree — the app carries the PROPOSED confluence
#      external-service type (platform-pr/external-services/confluence/) because
#      vpath_server ships neither the type nor any Spine-1 ontology to compose
#      the `system: confluence` value against. The value-space is S3
#      (platform-owned; "the hull declares the SLOT, not the values"), so the
#      hull adoption is NOT blocked — the pin drains when the platform PR lands.
model:
  name: vpath_hello_confluence_spine3
  layer: app
  version: 1.0.0
  extension_procedure: ontogate_canonical_cycle
  method_version: 0.10.44
  # The app repo this gate audits (relative to THIS .ontogate dir). READ-ONLY.
  app_repo: ..

# === FILL — which of the three sockets THIS app realizes =====================
# This app realizes ALL THREE: a Python FastAPI domain API (the Confluence
# client, surfaced via the Next proxy route), a product UI (the lazy space/page
# tree browser), and the manifest — here a PAIR (web + api sibling).
fill:
  backend:
    realized: true    # api/src/confluence (FastAPI) + src/app/api/confluence proxy
  frontend:
    realized: true    # src/app/page.tsx (the space/page tree browser)
  manifest:
    realized: true    # vpath-app.yaml (web) + api/vpath-app.yaml (the sibling pair)

# === NEED — the needs this app DECLARES in its manifest ======================
# THE DEFINING TRAIT of this app: it binds an EXTERNAL system and declares TWO
# resource kinds for it — a credential (system: confluence, delivery: header,
# identityBearing: true; the gate injects the user's binding as per-request
# X-Vpath-Credential-Confluence-* headers, no Confluence env in the pod) and a
# connector (the platform-wired egress). The richest NEED face of the three
# examples: fortune-teller declares none, agentic-resource-modeling one kind,
# this app two — across a two-manifest pair (see the pair-wide strict check).
need:
  resource_requirements:
    declared: true    # credential + connector (system: confluence) — pair-wide
  workflow:
    declared: false   # no spec.workflow (not a pipeline app)
  dapr:
    declared: true    # spec.dapr (appId/appPort); sibling-invoke URL is F1 (as_is)
  volumes:
    declared: true    # spec.volumes (mkcert-ca, tls-certs)
  auth_groups:
    declared: false   # only oidcClient; no requireGroups (need unused)
  app_storage:
    declared: false   # no appStorage block (the volumes are TLS, not storage)

# === SEAM — the M13 requirement-seam declaration (0.10.27 / 0.10.30) =========
# FORCED by M13: a book either carries a gated requirements->catalog coverage
# map (`status: covered`), or the absence of an external requirement set is a
# DATED operator decision on record (`status: n/a`). Silent omission reds the
# SEAM row — that is what the declaration exists to catch.
#
# This book declares `n/a`: it gates contract-composition of app stories against
# the LOCKED foundation hull (v1.2.0), and the requirements live UPSTREAM in that
# hull contract (normative parity home: platform app_model_spine H1-H9), not as a
# per-book requirement catalog — this book declares no catalog, the same
# structural fact that leaves MAP/MAPREF/AXIS input-less. Revisit if this book
# ever grows its own requirement catalog.
#
# The pointer is `<file> :: <anchor>`, file-half relative to the APP ROOT (this
# .ontogate dir's parent). Quoted because ` :: ` is not expressible as a plain
# YAML scalar; regenerate.py unquotes it on the way into ontology.json.
requirement_seam:
  status: n/a
  decision: "../../foundation/_vendor/VENDOR_PROVENANCE.md :: SEAM wired (2026-07-20)"

