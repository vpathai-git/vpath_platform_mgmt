apiVersion: vpath/v1
kind: ExternalService
metadata:
  name: confluence
  labels:
    app.kubernetes.io/part-of: vpath
    vpath.io/catalog: external-services
# ---
# PROPOSED platform change (ships as a PR against vpathai-git/vpath_server).
# Adds a `confluence` external-service type so apps can declare a Confluence
# credential resource (vpath-hello-confluence). Modeled verbatim on
# config/external-services/jira/external-service.yaml — system swapped jira ->
# confluence. After adding this file, regenerate the derived artifacts
# (external-services.lock.json + builtin-types.generated.json) with the
# platform generator (lib/pipeline/external_services/main.py).
#
# OPEN DECISION (egress host): Jira routes via api.atlassian.com/ex/jira/{tenant}.
# Confluence Cloud is reachable the same way (/ex/confluence/{tenant}/wiki) OR
# directly at https://<site>.atlassian.net/wiki. The credential `url` field is
# user-supplied at bind time, so the connector egress must allow whichever host
# the operator routes to. Defaulting to the api.atlassian.com gateway like jira.
# ---
spec:
  display_name: "Confluence Cloud"
  description: "Confluence Cloud REST API v2 (Atlassian)"
  icon: book-open
  color: "#0052cc"

  endpoint:
    hostname: api.atlassian.com
    port: 443
    protocol: https
    path_template: "/ex/confluence/{tenant_id}/wiki/"
    public_url_template: "https://{hostname}{path_template}"
    template_vars:
      - name: tenant_id
        source: env
        env_var: CONFLUENCE_TENANT_ID
        required: true
        description: "Atlassian tenant identifier (UUID); operator-supplied via .env"

  authentication:
    type: basic
    fields:
      - { name: name, type: string, required: true, protected: false, label: "Name" }
      - name: url
        type: url
        required: true
        protected: false
        label: "Confluence URL"
        derive_default_from: endpoint.public_url
      - name: token
        type: secret
        required: true
        protected: true
        label: "API Token (email:token)"
        format: "email:api-token"
    field_bindings:
      url:
        builtin_types_field: url
        seeded_property: endpoint
        seeded_property_aliases: [url]
        env_var_in_secret: CONFLUENCE_BASE_URL
      token:
        builtin_types_field: token
        seeded_property: null
        env_var_in_secret: CONFLUENCE_ACCESS_TOKEN
        compose_prefix_env: CONFLUENCE_EMAIL
        compose_separator: ":"

  operator_secrets:
    - name: email
      env_var_in_secret: CONFLUENCE_EMAIL
      env_var_required: CONFLUENCE_EMAIL
      description: "Atlassian account email; concatenated with token for basic-auth"
    - name: token
      env_var_in_secret: CONFLUENCE_ACCESS_TOKEN
      env_var_required: CONFLUENCE_ACCESS_TOKEN
      description: "Atlassian API token"

  k8s_secret_name: confluence-creds
  egress_namespaces:
    - vpath-platform
