apiVersion: vpath/v1
kind: VpathApp
metadata:
  name: vpath-fortune-teller-api
  namespace: vpath-fortune-teller
  labels:
    app.kubernetes.io/part-of: vpath
spec:
  deploy:
    readinessBudget: 300
  type: backend
  image: vpath-fortune-teller-api
  port: 8020
  auth:
    oidcClient: vpath-fortune-teller
  resources:
    requests: { memory: "128Mi", cpu: "50m" }
    limits: { memory: "256Mi", cpu: "250m" }
  health:
    readiness: /health
    liveness: /health
    scheme: HTTP
  dapr:
    appId: vpath-fortune-teller-api
    appPort: 8020
  # This app binds NO external system (the deck is local + deterministic), so
  # there is NO resourceRequirements block — nothing to provision or inject.
  build:
    runtime: python
    hash:
      dirs:
        - apps_infra/apps/vpath-fortune-teller-api
        - apps_infra/sdk-python/vpath-backend-sdk
    sdks:
      - name: vpath-backend-sdk
        source: apps_infra/sdk-python/vpath-backend-sdk
