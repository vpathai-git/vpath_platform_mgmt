# This VpathWorkflow is the authored source of truth. The platform generates the
# executable Argo YAML server-side; generated Argo YAML is never hand-edited and
# carries generator-owned discovery labels. The source label below names the
# template key that spec.workflow.pipeline[].template references (server pattern:
# sys-eng-1-document-conversion, basic-ingest).
apiVersion: vpath/v1
kind: VpathWorkflow
metadata:
  name: vpath-workflow-demo-text-insight
  namespace: vpath-workflow-demo
  version: "0.1.0"
  labels:
    vpath.io/template: vpath-workflow-demo-text-insight
spec:
  type: pipeline
  description: Extract, normalize, and agentically structure text from a PDF.
  build:
    runtime: none
  resourceRequirements:
    required:
      - class: agent-provider
        actions: [use]
  input_source: pvc
  accepted_file_types: [".pdf"]
  max_file_size_mb: 10
  inputs:
    folders:
      - name: raw_documents
        description: A PDF used by the text-insight demonstration.
        required: true
        min_files: 1
        accepted_types: [".pdf"]
  settings:
    detail_level:
      label: Summary Detail
      step: structure-text
      target: kp_env
      default: concise
      options: [concise, detailed]
  provisioning:
    kp_env: true
    agent_provider: basic-llm
  pipeline:
    entrypoint: main
    steps:
      - name: extract-text
        module: vpath-pdf-processing
        depends_on: []
        resources:
          requests: { memory: "256Mi", cpu: "200m" }
          limits: { memory: "512Mi" }
      - name: normalize-text
        module: vpath-text-flattening
        depends_on: [extract-text]
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits: { memory: "256Mi" }
      - name: structure-text
        module: vpath-document-structure
        agent:
          model: gpt-5-mini
        depends_on: [normalize-text]
        resources:
          requests: { memory: "256Mi", cpu: "250m" }
          limits: { memory: "512Mi" }
  parameters:
    kp_id:
      type: string
      required: true
      description: Knowledge Project ID
