  storedTemplates:
    namespaced/legacy-upload/finalize:
      container:
        args:
        - |
          set -e
          echo "=== Finalize: Pushing outputs to Gitea ==="
          KP_ID="{{workflow.parameters.kp-id}}"
          RUN_ID="{{workflow.parameters.run-id}}"
          OUTPUT_DIR="/workspace/output/${RUN_ID}"
          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "No output at $OUTPUT_DIR — nothing to push"
            exit 0
          fi
          if [ -z "$GITEA_USERNAME" ] || [ -z "$GITEA_PASSWORD" ]; then
            echo "ERROR: Gitea credentials missing; cannot persist workflow outputs"
            exit 1
          fi
          GITEA_HOST="gitea.gitea.svc.cluster.local"
          REPO_URL="https://${GITEA_USERNAME}:${GITEA_PASSWORD}@${GITEA_HOST}/kp-data/${KP_ID}-workspace.git"
          git config --global user.email "pipeline@vpath.local"
          git config --global user.name "vpath-pipeline"
          git config --global http.sslVerify false
          REPO_DIR="/tmp/workspace-repo"
          if ! git clone --depth 1 "$REPO_URL" "$REPO_DIR"; then
            echo "ERROR: Unable to clone pre-provisioned output repository: kp-data/${KP_ID}-workspace"
            exit 1
          fi
          mkdir -p "${REPO_DIR}/output/${RUN_ID}"
          cd "$OUTPUT_DIR"
          find . -type f -size -10M \
            -exec sh -c 'mkdir -p "'"${REPO_DIR}/output/${RUN_ID}"'/$(dirname "$1")" && cp "$1" "'"${REPO_DIR}/output/${RUN_ID}"'/$1"' _ {} \;
          cd "$REPO_DIR"
          git add -A
          if git diff --cached --quiet; then
            echo "No files to push"
          else
            PUSHED=$(git diff --cached --numstat | wc -l)
            git commit -m "Pipeline run ${RUN_ID}: ${PUSHED} artifacts"
            git push
            echo "Pushed ${PUSHED} files to Gitea"
          fi
          echo "Finalize complete"
        command:
        - sh
        - -c
        envFrom:
        - configMapRef:
            name: kp-env
        - secretRef:
            name: gitea-creds
            optional: true
        image: legacy-upload@sha256:4ba868d13e254484ac7ad392f167eb8b0c89b95cd4f95bacd1c9d3d51e7f1379
        name: ""
        resources: {}
        volumeMounts:
        - mountPath: /workspace
          name: workspace
      inputs: {}
      metadata: {}
      name: finalize
      outputs: {}
