    - container:
        args:
        - |
          echo "=== Init: Copying inputs to workspace ==="
          mkdir -p /workspace/inputs/raw_documents
          if [ -d /inputs ]; then
            find /inputs -mindepth 1 -maxdepth 1 -exec cp -R {} /workspace/inputs/raw_documents/ \;
          fi
          echo "Init complete — $(find /workspace/inputs -type f | wc -l) files staged"
        command:
        - sh
        - -c
        envFrom:
        - configMapRef:
            name: kp-env
        - secretRef:
            name: gitea-creds
            optional: true
        image: legacy-upload@sha256:4ba868d13e254484ac7ad392f167eb8b0c89b95cd4f95bacd1c9d3d51e7f1379
        name: ""
