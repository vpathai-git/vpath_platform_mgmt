<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vpath console</title>
<link rel="stylesheet" href="/console.css">
</head>
<body>
<header>
  <h1>vpath console</h1><span id="engine" class="badge sim">…</span>
  <div class="role" id="dev-identity">acting as
    <select id="role">
      <option value="app-dev">App-Entwickler</option>
      <option value="admin">Administrator</option>
      <option value="server-dev">Serverprojekt-Entwickler</option>
    </select>
    <input id="actor" value="you" size="8" aria-label="actor name">
  </div>
  <div class="role" id="oidc-identity" hidden>
    <span id="whoami" class="dim">not signed in</span>
    <button id="signin" onclick="signIn()">Sign in</button>
    <button id="signout" onclick="signOut()" hidden>Sign out</button>
  </div>
</header>

<div class="shell">
  <nav>
    <div class="grp">Server</div>
    <div class="nav-item sel" id="nav-dash" onclick="showDash()">
      <span>▤</span><span>Server Dashboard</span>
    </div>
    <div class="grp">Application Explorer</div>
    <div id="applist"></div>
  </nav>

  <main>
    <!-- Server dashboard -->
    <div class="view on" id="view-dash">
      <section>
        <h2>Applications</h2>
        <div class="row">
          <select id="verb">
            <option>deploy</option><option>build</option><option>health</option>
            <option>status</option><option>uninstall</option>
          </select>
          <select id="app" aria-label="application">
            <option value="">loading applications…</option>
          </select>
          <button onclick="submitJob()">Run</button>
          <button class="danger" onclick="reinstall()">reinstall server…</button>
        </div>
        <div id="msg" aria-live="polite"></div>
      </section>
      <section>
        <h2>Recent jobs</h2>
        <table id="jobs"></table>
      </section>
      <section>
        <h2>Platform health</h2>
        <div id="healthline" class="dim">no health run yet</div>
        <div class="gates" id="gates"></div>
      </section>
      <section>
        <h2>Locks</h2>
        <ul id="locks"><li class="dim">none held</li></ul>
      </section>
      <section>
        <h2>Audit trail</h2>
        <ul id="audit"></ul>
      </section>
    </div>

    <!-- Application explorer -->
    <div class="view" id="view-app">
      <section>
        <div class="title-row">
          <h3 id="a-title">—</h3><span class="chip q" id="a-type"></span>
          <span class="chip q" id="a-state">unknown</span>
        </div>
        <div class="dim" id="a-desc"></div>
        <div class="meta" id="a-meta"></div>
        <div class="row">
          <button class="primary" id="a-open">Open app</button>
          <button id="a-install" onclick="deploySelected()" hidden>
            Install on server
          </button>
          <button class="danger" id="a-uninstall" onclick="uninstallSelected()" hidden>
            Uninstall from server…
          </button>
        </div>
        <div id="a-msg" class="dim" style="font-size:12px;margin-top:8px"></div>
      </section>
      <section>
        <h2 id="f-name">Select a file in the explorer</h2>
        <div class="meta" id="f-meta"></div>
        <pre class="file" id="f-body">Pick a file on the left to inspect it.</pre>
      </section>
    </div>
  </main>
</div>
<script src="/auth.js"></script>
<script src="/console.js"></script>
<script src="/store.js"></script>
</body>
</html>
